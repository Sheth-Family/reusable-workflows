name: CI — Lint workflows (reusable)

# actionlint checks GitHub Actions syntax and delegates shell-script linting to
# shellcheck for every `run:` block automatically when shellcheck is in PATH.
#
# continue-on-error is intentionally omitted so failures block the merge.

on:
  workflow_call: {}

permissions:
  contents: read

jobs:
  actionlint:
    name: actionlint + shellcheck
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install shellcheck
        run: sudo apt-get install -y --no-install-recommends shellcheck

      - name: Install actionlint v1.7.4
        run: |
          set -euo pipefail
          curl -fsSL \
            "https://github.com/rhysd/actionlint/releases/download/v1.7.4/actionlint_1.7.4_linux_amd64.tar.gz" \
            -o /tmp/actionlint.tar.gz
          tar -xzf /tmp/actionlint.tar.gz -C /tmp actionlint
          sudo mv /tmp/actionlint /usr/local/bin/actionlint
          actionlint --version

      - name: "Run actionlint (includes shellcheck on all run: blocks)"
        run: actionlint -verbose
