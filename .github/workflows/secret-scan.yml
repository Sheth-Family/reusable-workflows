name: Secret Scan (reusable)

# Runs gitleaks on every PR and push to detect secrets that were
# accidentally committed. Blocks merge (via required check) when secrets are
# found.
#
# To suppress a false positive:
#   1. Add a .gitleaks.toml allowlist (see https://github.com/gitleaks/gitleaks).
#   2. OR add an inline `# gitleaks:allow` comment on the flagged line.
#   NEVER commit real credentials — rotate any secret that is found.
#
# Implementation: uses the OSS gitleaks binary directly (not gitleaks-action),
# which requires a license for organization repos and has a history of
# startup failures on GitHub-hosted runners. Same pattern used by opengrep-scan.yml.
#
# Assumes a .gitleaks.toml exists at the calling repo's root — every venture
# scaffolded from the golden image ships one by default.

on:
  workflow_call: {}

permissions:
  contents: read

jobs:
  gitleaks:
    name: gitleaks — detect secrets
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history so gitleaks can scan all commits in a PR, not just HEAD
          fetch-depth: 0

      - name: Install gitleaks
        run: |
          set -euo pipefail
          GITLEAKS_VERSION="8.27.0"
          curl -fsSL \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            -o /tmp/gitleaks.tar.gz
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks
          sudo mv /tmp/gitleaks /usr/local/bin/gitleaks
          gitleaks version

      - name: Run gitleaks
        run: |
          set -euo pipefail
          gitleaks detect \
            --source="." \
            --redact \
            --no-git=false \
            --exit-code=1 \
            --log-level=warn \
            --config=.gitleaks.toml
