# Reusable build+deploy workflow — GCP Cloud Run via Workload Identity
# Federation (keyless GitHub → GCP auth, no long-lived service account keys).
#
# Hosted centrally in Sheth-Family/reusable-workflows so every venture calls
# the SAME versioned logic instead of maintaining its own copy — see this
# repo's README for the versioning/update model. Cross-repo reusable
# workflows do NOT automatically see the calling repo's `vars` context, so
# every value that used to be a bare `vars.X` reference in the golden
# image's local copy is now an explicit input the caller must pass in.
#
# Setup a venture needs before using this (see ADR-0006/ADR-0007 in the
# golden image, and Sheth-Family/gcp-bootstrap for automating it):
#   - GCP project, Artifact Registry repo, WIF pool/provider, deployer SA
#   - Secrets named in `set_secrets` present in GCP Secret Manager
#   - If run_migrations is true: a GCP secret holding the raw
#     postgresql://postgres:PASSWORD@db.<ref>.supabase.co:5432/postgres
#     connection string (see supabase-db-url-secret), and a
#     SUPABASE_ACCESS_TOKEN passed as a GitHub secret
#
# See ADR-0008-ci-reusable-workflow.md for constraints discovered while
# extracting this pattern (permissions must be declared explicitly in the
# caller; boolean inputs need type: boolean; set_secrets must be a single
# quoted string, not a folded block scalar).
#
# Optional capabilities below (test-command, build-secrets, extra-env-vars,
# Datadog deploy events, Cloudflare cache purge, post-deploy log audit,
# Mission Control evidence) were generalized out of LiveSimpli/simpli's
# bespoke build-deploy.yml when simpli migrated onto this shared workflow —
# they default to off/empty so ventures that don't need them see no change.

name: Build and Deploy (reusable)

on:
  workflow_call:
    inputs:
      environment:
        required: true
        type: string
      service:
        required: true
        type: string
      next_public_env:
        required: true
        type: string
      dd_env:
        required: true
        type: string
      max_instances:
        required: true
        type: number
      service_account:
        description: "Deployer SA email to impersonate via WIF. Optional — falls back to the calling repo's own Environment-scoped GCP_DEPLOYER_SA variable (set by gcp-bootstrap's wire-github.sh) when omitted or empty. Pass explicitly only when a venture doesn't use that variable (e.g. a hardcoded value)."
        required: false
        type: string
      set_secrets:
        description: "Comma-separated SECRET_ENV_NAME=gcp-secret-name:version pairs, mounted at runtime via Cloud Run --set-secrets"
        required: true
        type: string
      gcp-project-id:
        required: true
        type: string
      gcp-region:
        required: true
        type: string
      gcp-wif-provider:
        required: true
        type: string
      gcp-artifact-repo:
        required: true
        type: string
      run-migrations:
        required: false
        type: boolean
        default: true
      supabase-project-ref:
        description: "Required if run-migrations is true"
        required: false
        type: string
        default: ""
      supabase-db-url-secret:
        description: "GCP Secret Manager secret name holding the raw postgresql://postgres:PASSWORD@db.<ref>.supabase.co connection string. Required if run-migrations is true."
        required: false
        type: string
        default: ""
      enable-smoke-and-rollback:
        required: false
        type: boolean
        default: true
      health-check-url:
        description: "Full URL to poll after deploy (e.g. https://your-app.example.com/api/health). Required if enable-smoke-and-rollback is true."
        required: false
        type: string
        default: ""
      test-command:
        description: "Optional shell command run before the Docker build (e.g. a chained npm test suite). Fails the deploy if non-zero. Empty = skipped."
        required: false
        type: string
        default: ""
      build-secrets:
        description: "Comma-separated BUILD_ARG_NAME=gcp-secret-name:version pairs, resolved via Secret Manager and passed as `docker build --build-arg`. Use for NEXT_PUBLIC_* values that must be baked in at build time."
        required: false
        type: string
        default: ""
      extra-env-vars:
        description: "Comma-separated plain KEY=value pairs (not secrets) appended to Cloud Run --set-env-vars alongside NEXT_PUBLIC_ENV/DD_ENV."
        required: false
        type: string
        default: ""
      datadog-api-key-secret:
        description: "GCP Secret Manager secret name holding a Datadog API key. If set, a deploy event is sent after Cloud Run deploy succeeds. Empty = skipped."
        required: false
        type: string
        default: ""
      dd-site:
        description: "Datadog site for the deploy-event API call (only used if datadog-api-key-secret is set)."
        required: false
        type: string
        default: "datadoghq.com"
      cloudflare-zone-id:
        description: "Cloudflare zone ID to purge after deploy. Requires cloudflare-purge-urls and the CLOUDFLARE_API_TOKEN secret. Empty = skipped."
        required: false
        type: string
        default: ""
      cloudflare-purge-urls:
        description: "Comma-separated absolute URLs to purge from Cloudflare's cache after deploy. Required if cloudflare-zone-id is set."
        required: false
        type: string
        default: ""
      enable-log-audit:
        description: "Scan the last 10 minutes of Cloud Run logs for DB-related errors after deploy. Requires roles/logging.viewer on the deployer service account — fails soft (continue-on-error) if missing."
        required: false
        type: boolean
        default: false
      public-via-load-balancer:
        description: "Serve this service publicly through an External HTTPS Load Balancer instead of Cloud Run's direct allUsers-invoker pattern — required for any venture created since the org's Domain Restricted Sharing policy took effect (see gcp-bootstrap's create_load_balancer / README \"Org-level prerequisites\"). When true: ingress is restricted to internal-and-cloud-load-balancing (the direct *.run.app URL stops responding — health-check-url must point at the LB's domain, not *.run.app), the service is tagged allUsersIngress=True, and allUsers is granted roles/run.invoker (now permitted only for this tagged, ingress-locked resource). False (default) preserves the old direct-Cloud-Run behavior unchanged — e.g. Simpli's grandfathered setup."
        required: false
        type: boolean
        default: false
      deploy-scan-job:
        description: "Deploy/update a Cloud Run Job (for a scan-engine worker) alongside the web service, using the SAME image this workflow just built — no second build/push pipeline. Cloud Run Jobs are CI-owned here, same as the web service itself (gcp-bootstrap never creates the job resource, only outputs the runtime SA identity to grant it execution IAM). False by default — most ventures don't have a scan-engine worker."
        required: false
        type: boolean
        default: false
      scan-job-name:
        description: "Cloud Run Job name. Required if deploy-scan-job is true."
        required: false
        type: string
        default: ""
      scan-job-command:
        description: "Container ENTRYPOINT override for the scan job, e.g. \"node\". Required if deploy-scan-job is true."
        required: false
        type: string
        default: ""
      scan-job-args:
        description: "Comma-separated container CMD args for the scan job, e.g. \"scripts/run-sca-scan.js\". Required if deploy-scan-job is true."
        required: false
        type: string
        default: ""
      scan-job-runtime-service-account:
        description: "Email of the identity to grant roles/run.jobsExecutorWithOverrides on this job (the web service's own runtime SA, so it can trigger executions from an API route) — gcp-bootstrap's RUNTIME_SERVICE_ACCOUNT_EMAIL output. Required if deploy-scan-job is true."
        required: false
        type: string
        default: ""
    secrets:
      SUPABASE_ACCESS_TOKEN:
        description: "Supabase Management API token. Required if run-migrations is true."
        required: false
      CLOUDFLARE_API_TOKEN:
        description: "Cloudflare API token with Zone:Cache Purge permission. Required if cloudflare-zone-id is set."
        required: false
      MISSION_CONTROL_URL:
        description: "Optional evidence-ingest endpoint. If set, post-deploy smoke results are POSTed here as JSON. Non-blocking on failure."
        required: false
      MISSION_CONTROL_INGEST_TOKEN:
        description: "Bearer token for MISSION_CONTROL_URL."
        required: false

permissions:
  contents: read
  id-token: write

jobs:
  pre-deploy:
    name: Capture prior Cloud Run revision
    runs-on: ubuntu-latest
    # See the "Resolve deployer service account" step below for why this
    # is here — each job that authenticates to GCP declares its own
    # `environment:` and resolves the fallback independently, rather
    # than funneling through one shared resolver job. An earlier attempt
    # centralized this into a single upstream job, but that broke two
    # things a per-job resolution avoids: the OIDC token each job mints
    # for `google-github-actions/auth` carries an environment-scoped
    # subject claim only when *that job itself* has `environment:` set
    # (GCP WIF trust policies can require this), and any
    # Environment-scoped secrets a job's own steps read (e.g.
    # SUPABASE_ACCESS_TOKEN, CLOUDFLARE_API_TOKEN, if a venture sets
    # them at the Environment level rather than repo level) are only
    # available to a job with that Environment active (Codex review
    # findings, PR #3). Some duplication across the three jobs below is
    # the accepted tradeoff — it's confined to this one file, unlike the
    # cross-repo duplication a resolver job in every calling venture's
    # deploy-staging.yml would have caused (an earlier, rejected attempt
    # at this same fix).
    environment: ${{ inputs.environment }}
    permissions:
      contents: read
      id-token: write
    outputs:
      prior_revision: ${{ steps.prior.outputs.revision }}
    steps:
      - name: Resolve deployer service account
        id: resolve-sa
        env:
          INPUT_SA: ${{ inputs.service_account }}
          VARS_SA: ${{ vars.GCP_DEPLOYER_SA }}
        run: |
          set -euo pipefail
          # Falls back to this Environment's own GCP_DEPLOYER_SA
          # variable (set by gcp-bootstrap's wire-github.sh) when a
          # caller doesn't pass service_account explicitly. Fails loudly
          # rather than silently authenticating as the bare WIF principal
          # (no roles of its own) if BOTH are empty — confirmed live
          # (2026-09-02/03, wearesentinull/sentinull) that an unresolved
          # empty service_account turns a call-time configuration error
          # into a confusing late deployment failure: the build succeeds,
          # but every subsequent GCP operation is denied in a way that
          # looks exactly like IAM propagation lag.
          VALUE="${INPUT_SA:-$VARS_SA}"
          if [ -z "$VALUE" ]; then
            echo "::error::No service_account input was provided, and this environment's GCP_DEPLOYER_SA variable is also empty or unset. Set one or the other before deploying."
            exit 1
          fi
          echo "value=${VALUE}" >> "$GITHUB_OUTPUT"

      - name: Authenticate to GCP (Workload Identity Federation)
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ inputs.gcp-wif-provider }}
          service_account: ${{ steps.resolve-sa.outputs.value }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3.0.1

      - name: Capture prior revision
        id: prior
        env:
          SERVICE: ${{ inputs.service }}
          REGION: ${{ inputs.gcp-region }}
          PROJECT_ID: ${{ inputs.gcp-project-id }}
        run: |
          set -uo pipefail
          REVISION=$(gcloud run revisions list \
            --service="$SERVICE" \
            --region="$REGION" \
            --project="$PROJECT_ID" \
            --format='value(metadata.name)' \
            --limit=1 \
            --sort-by='~metadata.creationTimestamp' 2>/dev/null || echo "")
          echo "revision=${REVISION}" >> "$GITHUB_OUTPUT"
          echo "Prior revision: ${REVISION:-<none — first deploy>}"

  build-and-deploy:
    name: Build and deploy (${{ inputs.environment }})
    needs: pre-deploy
    runs-on: ubuntu-latest
    # See the comment on pre-deploy's environment: above.
    environment: ${{ inputs.environment }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Run pre-deploy tests
        if: inputs.test-command != ''
        run: ${{ inputs.test-command }}

      - name: Resolve deployer service account
        id: resolve-sa
        env:
          INPUT_SA: ${{ inputs.service_account }}
          VARS_SA: ${{ vars.GCP_DEPLOYER_SA }}
        run: |
          set -euo pipefail
          VALUE="${INPUT_SA:-$VARS_SA}"
          if [ -z "$VALUE" ]; then
            echo "::error::No service_account input was provided, and this environment's GCP_DEPLOYER_SA variable is also empty or unset. Set one or the other before deploying."
            exit 1
          fi
          echo "value=${VALUE}" >> "$GITHUB_OUTPUT"

      - name: Authenticate to GCP (Workload Identity Federation)
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ inputs.gcp-wif-provider }}
          service_account: ${{ steps.resolve-sa.outputs.value }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3.0.1

      - name: Configure Docker for Artifact Registry
        env:
          REGION: ${{ inputs.gcp-region }}
        run: gcloud auth configure-docker "${REGION}-docker.pkg.dev" --quiet

      - name: Build and push image
        env:
          IMAGE: "${{ inputs.gcp-region }}-docker.pkg.dev/${{ inputs.gcp-project-id }}/${{ inputs.gcp-artifact-repo }}/${{ inputs.service }}:${{ github.sha }}"
          NEXT_PUBLIC_ENV: ${{ inputs.next_public_env }}
          BUILD_SECRETS: ${{ inputs.build-secrets }}
          PROJECT_ID: ${{ inputs.gcp-project-id }}
        run: |
          set -euo pipefail
          BUILD_ARGS=(--build-arg "NEXT_PUBLIC_ENV=${NEXT_PUBLIC_ENV}")
          if [ -n "$BUILD_SECRETS" ]; then
            IFS=',' read -ra PAIRS <<< "$BUILD_SECRETS"
            for pair in "${PAIRS[@]}"; do
              ARG_NAME="${pair%%=*}"
              SECRET_REF="${pair#*=}"
              SECRET_NAME="${SECRET_REF%%:*}"
              SECRET_VERSION="${SECRET_REF#*:}"
              VALUE=$(gcloud secrets versions access "$SECRET_VERSION" --secret="$SECRET_NAME" --project="$PROJECT_ID")
              echo "::add-mask::${VALUE}"
              BUILD_ARGS+=(--build-arg "${ARG_NAME}=${VALUE}")
            done
          fi
          docker build "${BUILD_ARGS[@]}" -t "$IMAGE" .
          docker push "$IMAGE"

      - name: Apply Supabase migrations
        if: inputs.run-migrations
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ inputs.supabase-project-ref }}
          DB_URL_SECRET: ${{ inputs.supabase-db-url-secret }}
          PROJECT_ID: ${{ inputs.gcp-project-id }}
        run: |
          set -euo pipefail
          if [ -z "$SUPABASE_ACCESS_TOKEN" ] || [ -z "$SUPABASE_PROJECT_REF" ] || [ -z "$DB_URL_SECRET" ]; then
            echo "::error::run-migrations is true but SUPABASE_ACCESS_TOKEN secret, supabase-project-ref, or supabase-db-url-secret input is missing."
            exit 1
          fi

          # Resolve the pooler host from the Management API instead of
          # hardcoding or guessing a region/instance number. A hardcoded
          # guess here caused a multi-hour production incident in
          # LiveSimpli/simpli (2026-08-31/09-01): the pooler host isn't
          # just region-specific, it's a specific numbered instance
          # (aws-0, aws-1, ...) per project, and a stale/guessed value
          # fails with "tenant not found" — a confusing error that looks
          # like a bad password, not a routing problem. Always ask
          # Supabase which pooler this project actually uses.
          POOLER_HOST=$(curl -sf \
            -H "Authorization: Bearer ${SUPABASE_ACCESS_TOKEN}" \
            "https://api.supabase.com/v1/projects/${SUPABASE_PROJECT_REF}/config/database/pooler" \
            | python3 -c "import json,sys; print(json.load(sys.stdin)[0]['db_host'])")
          echo "Resolved pooler host: ${POOLER_HOST}"

          # SIM-2471 (LiveSimpli/simpli): db.*.supabase.co resolves IPv6-only;
          # GitHub Actions runners have no IPv6 route to AWS. Use the
          # session-mode pooler (IPv4, port 5432) instead — required for
          # `supabase db push`'s DDL/prepared-statement usage; transaction
          # mode (port 6543) doesn't support it. User changes from
          # `postgres` to `postgres.[ref]` per Supabase pooler auth
          # requirements.
          DB_URL=$(gcloud secrets versions access latest --secret="$DB_URL_SECRET" --project="$PROJECT_ID")
          echo "::add-mask::${DB_URL}"
          POOLER_URL=$(printf '%s' "$DB_URL" | POOLER_HOST="$POOLER_HOST" python3 -c "import re,os,sys;u=sys.stdin.read().strip();m=re.match('postgresql://([^:]+):([^@]+)@db[.]([^.]+)[.]supabase[.]co:[0-9]+/([^?]*)',u);print('postgresql://'+m.group(1)+'.'+m.group(3)+':'+m.group(2)+'@'+os.environ['POOLER_HOST']+':5432/'+m.group(4) if m else u)")
          echo "::add-mask::${POOLER_URL}"
          npx supabase db push --db-url "$POOLER_URL"

      - name: Deploy to Cloud Run
        env:
          IMAGE: "${{ inputs.gcp-region }}-docker.pkg.dev/${{ inputs.gcp-project-id }}/${{ inputs.gcp-artifact-repo }}/${{ inputs.service }}:${{ github.sha }}"
          SERVICE: ${{ inputs.service }}
          REGION: ${{ inputs.gcp-region }}
          MAX_INSTANCES: ${{ inputs.max_instances }}
          NEXT_PUBLIC_ENV: ${{ inputs.next_public_env }}
          DD_ENV: ${{ inputs.dd_env }}
          SET_SECRETS: ${{ inputs.set_secrets }}
          EXTRA_ENV_VARS: ${{ inputs.extra-env-vars }}
          PUBLIC_VIA_LB: ${{ inputs.public-via-load-balancer }}
        run: |
          set -euo pipefail
          ENV_VARS="NEXT_PUBLIC_ENV=${NEXT_PUBLIC_ENV},DD_ENV=${DD_ENV}"
          if [ -n "$EXTRA_ENV_VARS" ]; then
            ENV_VARS="${ENV_VARS},${EXTRA_ENV_VARS}"
          fi
          # allUsers-invoker (below) is a Domain Restricted Sharing no-op
          # for any project created since 2026-09-01 — see gcp-bootstrap's
          # README "Org-level prerequisites". public-via-load-balancer
          # replaces it with the DRS-compatible pattern instead of setting
          # --allow-unauthenticated here; the direct *.run.app URL becomes
          # unreachable once ingress is restricted below, by design.
          if [ "$PUBLIC_VIA_LB" = "true" ]; then
            INGRESS_FLAG=(--ingress=internal-and-cloud-load-balancing)
          else
            INGRESS_FLAG=()
          fi
          gcloud run deploy "$SERVICE" \
            --image="$IMAGE" \
            --region="$REGION" \
            --max-instances="$MAX_INSTANCES" \
            --set-env-vars="$ENV_VARS" \
            --set-secrets="$SET_SECRETS" \
            "${INGRESS_FLAG[@]}" \
            --quiet

      - name: Configure public access via Load Balancer
        if: inputs.public-via-load-balancer == true
        env:
          SERVICE: ${{ inputs.service }}
          REGION: ${{ inputs.gcp-region }}
          PROJECT_ID: ${{ inputs.gcp-project-id }}
        run: |
          set -euo pipefail
          # Idempotent: tolerate an already-existing binding from a prior
          # deploy of this same service.
          if ! gcloud resource-manager tags bindings create \
            --tag-value=143642315492/allUsersIngress/True \
            --parent="//run.googleapis.com/projects/${PROJECT_ID}/locations/${REGION}/services/${SERVICE}" \
            --location="$REGION" --quiet 2>err.log; then
            grep -q ALREADY_EXISTS err.log || { cat err.log; exit 1; }
          fi
          # Now permitted by the org's conditional DRS exemption, since
          # the service above is tagged AND ingress-restricted — a plain
          # --allow-unauthenticated on the earlier deploy step would have
          # run before the tag existed and silently no-op'd.
          gcloud run services add-iam-policy-binding "$SERVICE" \
            --region="$REGION" --member=allUsers --role=roles/run.invoker --quiet

      - name: Deploy scan job
        if: inputs.deploy-scan-job == true
        env:
          IMAGE: "${{ inputs.gcp-region }}-docker.pkg.dev/${{ inputs.gcp-project-id }}/${{ inputs.gcp-artifact-repo }}/${{ inputs.service }}:${{ github.sha }}"
          JOB_NAME: ${{ inputs.scan-job-name }}
          REGION: ${{ inputs.gcp-region }}
          COMMAND: ${{ inputs.scan-job-command }}
          JOB_ARGS: ${{ inputs.scan-job-args }}
          RUNTIME_SA: ${{ inputs.scan-job-runtime-service-account }}
        run: |
          set -euo pipefail
          # `gcloud run jobs deploy` creates on first run, updates on every
          # later one — same CI-owned pattern as `gcloud run deploy` for the
          # web service two steps up. Always tracks THIS deploy's image, no
          # second build/push pipeline.
          gcloud run jobs deploy "$JOB_NAME" \
            --image="$IMAGE" \
            --region="$REGION" \
            --command="$COMMAND" \
            --args="$JOB_ARGS" \
            --max-retries=1 \
            --task-timeout=600s \
            --quiet
          # Lets the web service's own runtime identity trigger executions
          # of this job from an API route (Cloud Run Admin API, jobs.run)
          # without granting it anything broader — add-iam-policy-binding
          # is idempotent on repeat, unlike the tag-bindings create call
          # above, so no ALREADY_EXISTS handling needed here.
          gcloud run jobs add-iam-policy-binding "$JOB_NAME" \
            --region="$REGION" \
            --member="serviceAccount:${RUNTIME_SA}" \
            --role=roles/run.jobsExecutorWithOverrides \
            --quiet

      - name: Send deploy event to Datadog
        if: inputs.datadog-api-key-secret != ''
        continue-on-error: true
        env:
          DD_API_KEY_SECRET: ${{ inputs.datadog-api-key-secret }}
          PROJECT_ID: ${{ inputs.gcp-project-id }}
          DD_SITE: ${{ inputs.dd-site }}
          DD_ENV: ${{ inputs.dd_env }}
          SERVICE: ${{ inputs.service }}
          SHA: ${{ github.sha }}
          RUN_URL: "https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
        run: |
          set -euo pipefail
          DD_API_KEY=$(gcloud secrets versions access latest --secret="$DD_API_KEY_SECRET" --project="$PROJECT_ID" 2>/dev/null || echo "")
          echo "::add-mask::${DD_API_KEY}"
          if [ -z "$DD_API_KEY" ]; then
            echo "⚠️  ${DD_API_KEY_SECRET} not accessible — skipping Datadog deploy event"
            exit 0
          fi
          SHORT_SHA="${SHA:0:7}"
          PAYLOAD=$(jq -nc \
            --arg env "$DD_ENV" \
            --arg service "$SERVICE" \
            --arg sha "$SHORT_SHA" \
            --arg run_url "$RUN_URL" \
            '{
              title: "Deploy: \($service) \($env) @ \($sha)",
              text: "%%% \nDeployed **\($service)** to **\($env)**\n\nCommit: `\($sha)`\nWorkflow: \($run_url)\n %%%",
              tags: ["env:\($env)", "service:\($service)", "version:\($sha)"],
              alert_type: "info",
              source_type_name: "github"
            }')
          RESPONSE=$(curl -s -o /tmp/dd_event.json -w '%{http_code}' \
            -X POST "https://api.${DD_SITE}/api/v1/events" \
            -H "Content-Type: application/json" \
            -H "DD-API-KEY: ${DD_API_KEY}" \
            -d "$PAYLOAD")
          if [ "$RESPONSE" = "202" ]; then
            echo "✅ Datadog deploy event sent (env=$DD_ENV sha=${SHA:0:7})"
          else
            echo "⚠️  Datadog event returned HTTP $RESPONSE"
            cat /tmp/dd_event.json 2>/dev/null || true
          fi

      - name: Purge Cloudflare cache
        if: inputs.cloudflare-zone-id != ''
        continue-on-error: true
        env:
          CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ZONE_ID: ${{ inputs.cloudflare-zone-id }}
          PURGE_URLS: ${{ inputs.cloudflare-purge-urls }}
        run: |
          if [ -z "$CF_API_TOKEN" ]; then
            echo "⚠️  cloudflare-zone-id is set but CLOUDFLARE_API_TOKEN secret is missing — skipping cache purge"
            exit 0
          fi
          if [ -z "$PURGE_URLS" ]; then
            echo "⚠️  cloudflare-zone-id is set but cloudflare-purge-urls is empty — skipping cache purge"
            exit 0
          fi
          PAYLOAD=$(python3 -c "import json,os; print(json.dumps({'files': os.environ['PURGE_URLS'].split(',')}))")
          RESPONSE=$(curl -s -X POST \
            "https://api.cloudflare.com/client/v4/zones/${CF_ZONE_ID}/purge_cache" \
            -H "Authorization: Bearer ${CF_API_TOKEN}" \
            -H "Content-Type: application/json" \
            -d "$PAYLOAD")
          SUCCESS=$(echo "$RESPONSE" | python3 -c "import sys,json; d=json.load(sys.stdin); print(d.get('success', False))" 2>/dev/null || echo "false")
          if [ "$SUCCESS" = "True" ]; then
            echo "✅ Cloudflare cache purged"
          else
            echo "⚠️  Cloudflare cache purge failed: $RESPONSE"
          fi

  smoke-and-rollback:
    name: Smoke & Rollback (${{ inputs.environment }})
    needs: [pre-deploy, build-and-deploy]
    if: inputs.enable-smoke-and-rollback
    runs-on: ubuntu-latest
    # See the comment on pre-deploy's environment: above. This job is a
    # post-deploy safety net — accepting the (currently theoretical, for
    # every venture's Environments today have zero protection rules
    # configured) risk that a future required-reviewer/wait-timer
    # protection rule would gate it a second time, in exchange for
    # correct OIDC subject claims and Environment-scoped secrets access,
    # which actually broke when an earlier attempt at this fix removed
    # environment: to avoid exactly that theoretical risk (Codex review
    # findings, PR #3).
    environment: ${{ inputs.environment }}
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Resolve deployer service account
        id: resolve-sa
        env:
          INPUT_SA: ${{ inputs.service_account }}
          VARS_SA: ${{ vars.GCP_DEPLOYER_SA }}
        run: |
          set -euo pipefail
          VALUE="${INPUT_SA:-$VARS_SA}"
          if [ -z "$VALUE" ]; then
            echo "::error::No service_account input was provided, and this environment's GCP_DEPLOYER_SA variable is also empty or unset. Set one or the other before deploying."
            exit 1
          fi
          echo "value=${VALUE}" >> "$GITHUB_OUTPUT"

      - name: Authenticate to GCP (Workload Identity Federation)
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ inputs.gcp-wif-provider }}
          service_account: ${{ steps.resolve-sa.outputs.value }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3.0.1

      - name: Post-deploy smoke test
        id: smoke
        env:
          HEALTH_URL: ${{ inputs.health-check-url }}
        run: |
          set -euo pipefail
          if [ -z "$HEALTH_URL" ]; then
            echo "::error::enable-smoke-and-rollback is true but health-check-url input is empty."
            exit 1
          fi
          echo "Polling $HEALTH_URL ..."
          ok=0
          for i in $(seq 1 12); do
            HTTP_CODE=$(curl -sf --max-time 10 -w '%{http_code}' -o /tmp/health.json "$HEALTH_URL" 2>/dev/null || echo "000")
            if [ "$HTTP_CODE" = "200" ]; then
              echo "✅ Smoke passed (attempt $i)"
              cat /tmp/health.json
              # Surface individual check latencies when the health payload has
              # the { checks: {...} } shape (best-effort — silent no-op otherwise).
              jq -r '
                (.checks // {}) | to_entries[] |
                (.value.status // "?") as $st |
                (if $st == "ok" then "✅" elif $st == "unconfigured" then "⚠️" else "❌" end) as $icon |
                (if .value.error then " error=\(.value.error)" else "" end) as $err |
                "  \($icon) \(.key): \($st) (\(.value.latency_ms // "?")ms)\($err)"
              ' /tmp/health.json 2>/dev/null || true
              ok=1
              break
            fi
            echo "⏳ Attempt $i/12: HTTP $HTTP_CODE — retrying in 5s"
            sleep 5
          done
          if [ "$ok" = "0" ]; then
            echo "❌ Smoke failed after 12 attempts (60s) — triggering rollback"
            cat /tmp/health.json 2>/dev/null || true
            exit 1
          fi

      - name: Rollback to prior revision
        if: failure()
        env:
          SERVICE: ${{ inputs.service }}
          REGION: ${{ inputs.gcp-region }}
          PROJECT_ID: ${{ inputs.gcp-project-id }}
          PRIOR: ${{ needs.pre-deploy.outputs.prior_revision }}
        run: |
          set -euo pipefail
          if [ -n "$PRIOR" ]; then
            echo "⏪ Rolling back ${SERVICE} to ${PRIOR} ..."
            gcloud run services update-traffic "$SERVICE" \
              --to-revisions="${PRIOR}=100" \
              --region="$REGION" \
              --project="$PROJECT_ID"
            echo "✅ Rollback complete — ${PRIOR} serving 100%"
          else
            echo "⚠️  No prior revision recorded — skipping rollback (first deploy?)"
          fi

      - name: Verify deployed revision is serving traffic
        if: always()
        continue-on-error: true
        env:
          SERVICE: ${{ inputs.service }}
          REGION: ${{ inputs.gcp-region }}
          PROJECT_ID: ${{ inputs.gcp-project-id }}
        run: |
          set -euo pipefail
          ACTIVE_REVISION=$(gcloud run services describe "$SERVICE" \
            --region="$REGION" \
            --project="$PROJECT_ID" \
            --format="value(status.traffic[0].revisionName)" 2>/dev/null || echo "")
          if [ -z "$ACTIVE_REVISION" ]; then
            echo "⚠️  Could not determine active revision — check deployer SA permissions"
          else
            echo "✅ Active revision serving traffic: $ACTIVE_REVISION"
            READY=$(gcloud run revisions describe "$ACTIVE_REVISION" \
              --region="$REGION" \
              --project="$PROJECT_ID" \
              --format="value(status.conditions[0].status)" 2>/dev/null || echo "Unknown")
            echo "   Revision ready status: $READY"
          fi

      - name: Post-deploy log audit (DB errors)
        if: always() && inputs.enable-log-audit
        continue-on-error: true
        env:
          SERVICE: ${{ inputs.service }}
          PROJECT_ID: ${{ inputs.gcp-project-id }}
        run: |
          echo "Scanning Cloud Run logs for DB errors (last 10 min)..."
          ENTRIES=$(gcloud logging read \
            "resource.type=cloud_run_revision \
             AND resource.labels.service_name=${SERVICE} \
             AND severity>=ERROR \
             AND (textPayload=~\"ECONNREFUSED|connect.*refused|auth.*fail|pool.*exhaust|supabase.*error|postgres.*error\" \
                 OR jsonPayload.message=~\"ECONNREFUSED|connect.*refused|auth.*fail|pool.*exhaust\")" \
            --freshness=10m \
            --project="$PROJECT_ID" \
            --format="json" \
            --limit=20 2>/dev/null || echo "[]")
          COUNT=$(echo "$ENTRIES" | python3 -c "import sys,json; print(len(json.load(sys.stdin)))" 2>/dev/null || echo "?")
          if [ "$COUNT" = "0" ]; then
            echo "✅ No DB-related errors in Cloud Run logs (last 10 min)"
          elif [ "$COUNT" = "?" ]; then
            echo "⚠️  Log read failed — ensure the deployer service account has roles/logging.viewer"
          else
            echo "⚠️  Found $COUNT DB-related error entries in the last 10 min:"
            echo "$ENTRIES" | python3 -c "import sys,json;[print('  ['+e.get('timestamp','?')+'] '+str(e.get('textPayload') or (e.get('jsonPayload') or {}).get('message','?'))[:200]) for e in json.load(sys.stdin)[:5]]"
          fi

      - name: Emit Mission Control evidence
        if: always()
        env:
          MISSION_CONTROL_URL: ${{ secrets.MISSION_CONTROL_URL }}
          MISSION_CONTROL_INGEST_TOKEN: ${{ secrets.MISSION_CONTROL_INGEST_TOKEN }}
          SERVICE: ${{ inputs.service }}
          ENVIRONMENT: ${{ inputs.environment }}
          SHA: ${{ github.sha }}
          SMOKE_RESULT: ${{ steps.smoke.outcome }}
          PRIOR: ${{ needs.pre-deploy.outputs.prior_revision }}
          RUN_ID: ${{ github.run_id }}
          RUN_URL: "https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
        run: |
          ROLLBACK_TRIGGERED="false"
          if [ "$SMOKE_RESULT" != "success" ] && [ -n "$PRIOR" ]; then
            ROLLBACK_TRIGGERED="true"
          fi
          jq -n \
            --arg event "post_deploy_smoke" \
            --arg service "$SERVICE" \
            --arg environment "$ENVIRONMENT" \
            --arg sha "$SHA" \
            --arg result "$SMOKE_RESULT" \
            --arg prior_revision "$PRIOR" \
            --arg rollback_triggered "$ROLLBACK_TRIGGERED" \
            --arg run_id "$RUN_ID" \
            --arg run_url "$RUN_URL" \
            '{event: $event, service: $service, environment: $environment, sha: $sha,
              result: $result, prior_revision: $prior_revision,
              rollback_triggered: $rollback_triggered, run_id: $run_id, run_url: $run_url}' \
            > /tmp/smoke-evidence.json
          echo "Evidence:"
          cat /tmp/smoke-evidence.json
          if [ -n "${MISSION_CONTROL_URL:-}" ]; then
            curl -sf -X POST "${MISSION_CONTROL_URL}/ingest" \
              -H "Authorization: Bearer ${MISSION_CONTROL_INGEST_TOKEN}" \
              -H "Content-Type: application/json" \
              -d @/tmp/smoke-evidence.json \
              || echo "⚠️  Mission Control ingest failed (non-blocking)"
          fi

      - name: Upload smoke evidence artifact
        if: always()
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
        with:
          name: smoke-evidence-${{ inputs.environment }}-${{ github.run_id }}
          path: /tmp/smoke-evidence.json
          retention-days: 30
